[package]
name = "chevaliers-translators"
version = "0.16.1"
edition = "2021"
description = "Chevaliers Translators - traduction du chat de World of Warcraft sur le PC du joueur"
license = "GPL-3.0-or-later"
repository = "https://github.com/Heaumite/chevaliers-translators"

# Bibliothèque commune (bandeau, miroir, traduction, modèles) et deux exécutables : l'application
# du joueur (sans console, icône près de l'horloge) et les outils de développement (console).
[lib]
name = "ct"
path = "src/lib.rs"

[[bin]]
name = "ChevaliersTranslators"
path = "src/main.rs"

[[bin]]
name = "ct-outils"
path = "src/bin/ct-outils.rs"

[dependencies]
# Décompression zlib des archives du jeu (pure Rust, sans dépendance C).
flate2 = "1"
# Rendu des polices du chat miroir (pur Rust).
fontdue = "0.9"
# Échanges JSON avec le serveur de traduction local (llama.cpp).
serde_json = "1"
# Détection de la langue des messages (pur Rust, fréquences de trigrammes), complétée par
# les indices propres au chat (src/lang.rs).
whatlang = "0.18"

[target.'cfg(windows)'.dependencies]
# Fenêtre de l'interface : fenêtre native et moteur web WebView2 (livré avec Windows 10 et 11).
wry = "0.57"
tao = "0.37"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_System_Registry",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Media",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_Storage_Xps",
] }

[profile.release]
opt-level = 3
